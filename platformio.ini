; PlatformIO project config for the Follower ESP32 companion controller
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial monitor at 115200
monitor_speed = 115200

lib_deps =
    ; Pixy2 Arduino library (official CMUcam5 port)
    charmedlabs/Pixy2 @ ^1.0.3
    ; MAVLink C headers - use the ardupilot community pack
    mavlink/mavlink @ ^2.0.0

; Upload via USB - change port as needed
upload_port = COM3          ; Windows - change to /dev/ttyUSB0 on Linux
upload_speed = 921600

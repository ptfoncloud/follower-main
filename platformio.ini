; follower ESP32 companion
;   esp32dev   - flight firmware (everything in src/ except bench/)
;   pixy_bench - pixy2 SPI bench test only, no FC, no MAVLink
;   native     - desktop tests (CI just uses g++ directly, see build.yml)

[platformio]
; plain `pio run` = flight firmware. without this it also tried to build
; the arduino code for [env:native] and failed
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; bench sketches have their own setup()/loop(), keep them out of this build
build_src_filter = +<*> -<bench/>
; charmedlabs/Pixy2 and mavlink/mavlink don't exist in the registry, the
; old lib_deps never resolved.
;  - arduino12/pixy2: the official charmed labs headers (arduino_pixy2-1.0.3)
;    repackaged for pio, without the AVR only zumo files (don't build on
;    ESP32) and with PIXY_DEBUG off. driver code is the same as the zip.
;  - okalachev/MAVLink: official MAVLink C headers packaged for arduino,
;    regenerated monthly. <MAVLink.h> = common dialect. pinned so the
;    flight build doesn't change on its own.
lib_deps =
    arduino12/pixy2 @ 1.0.4
    okalachev/MAVLink @ 2.0.33
; no upload_port on purpose. COM3 on my machine is the flight controller,
; hardcoding it pointed esptool at the FC. pio finds the ESP32 on its own,
; if there's more than one board plugged in use --upload-port COMx
; (device manager > ports shows which one is the ESP32)
upload_speed = 921600

[env:pixy_bench]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter = -<*> +<bench/pixy_bench.cpp>
lib_deps =
    arduino12/pixy2 @ 1.0.4

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -I src

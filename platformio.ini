; PlatformIO project config for the Follower ESP32 companion controller.
; Two environments: esp32dev (the real flight firmware) and native
; (desktop-compiled unit tests for the safety-gating logic — no ESP32
; hardware needed to run these).

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Neither "charmedlabs/Pixy2" nor "mavlink/mavlink" exists in the
; PlatformIO registry, so the old lib_deps never resolved.
;  - arduino12/pixy2: Charmed Labs' official Pixy2 Arduino headers
;    (arduino_pixy2-1.0.3) repackaged for PlatformIO, minus the AVR-only
;    Zumo robot files (which don't build on ESP32) and with PIXY_DEBUG
;    off. Driver code is otherwise identical to the official zip.
;  - okalachev/MAVLink: maintained Arduino packaging of the official
;    MAVLink C headers, regenerated monthly. <MAVLink.h> = common dialect.
;    Pinned exactly so a flight build doesn't change under you.
lib_deps =
    arduino12/pixy2 @ 1.0.4
    okalachev/MAVLink @ 2.0.33
; No upload_port on purpose: COM3 on the dev machine is the FLIGHT
; CONTROLLER, not the ESP32, so hardcoding it pointed esptool at the FC.
; PlatformIO auto-detects the ESP32. If several boards are plugged in,
; pass it per run: pio run -e esp32dev -t upload --upload-port COMx
; (Device Manager > Ports shows which COM the ESP32's USB-serial chip is).
upload_speed = 921600

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -I src
